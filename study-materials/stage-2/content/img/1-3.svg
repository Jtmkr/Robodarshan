<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 392" role="img" aria-label="SPI wiring: SCK, MOSI and MISO are shared by every device, and each device has its own chip select wire">
  <rect width="680" height="392" rx="12" fill="#f8fafc"/>
  <g font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1e293b">
    <!-- master -->
    <rect x="30" y="40" width="140" height="230" rx="10" fill="#e0ecff" stroke="#2563eb" stroke-width="2"/>
    <text x="100" y="62" text-anchor="middle" font-weight="700" font-size="16">ESP32</text>
    <text x="162" y="80" text-anchor="end" font-size="13">SCK (18)</text>
    <text x="162" y="110" text-anchor="end" font-size="13">MOSI (23)</text>
    <text x="162" y="140" text-anchor="end" font-size="13">MISO (19)</text>
    <text x="162" y="170" text-anchor="end" font-size="13">CS1 (5)</text>
    <text x="162" y="200" text-anchor="end" font-size="13">CS2 (4)</text>

    <!-- device 1 -->
    <rect x="500" y="40" width="150" height="150" rx="10" fill="#fff" stroke="#334155" stroke-width="2"/>
    <text x="575" y="60" text-anchor="middle" font-weight="700">Device 1</text>
    <text x="508" y="80" font-size="13">SCK</text>
    <text x="508" y="110" font-size="13">MOSI</text>
    <text x="508" y="140" font-size="13">MISO</text>
    <text x="508" y="170" font-size="13">CS</text>

    <!-- device 2 -->
    <rect x="500" y="205" width="150" height="150" rx="10" fill="#fff" stroke="#334155" stroke-width="2"/>
    <text x="575" y="225" text-anchor="middle" font-weight="700">Device 2</text>
    <text x="508" y="245" font-size="13">CS</text>
    <text x="508" y="275" font-size="13">SCK</text>
    <text x="508" y="305" font-size="13">MOSI</text>
    <text x="508" y="335" font-size="13">MISO</text>

    <!-- shared lines -->
    <g stroke-width="2.5" fill="none">
      <path d="M170 75 H500 M440 75 V270 H500" stroke="#2563eb"/>
      <path d="M170 105 H500 M455 105 V300 H500" stroke="#16a34a"/>
      <path d="M170 135 H500 M470 135 V330 H500" stroke="#ea580c"/>
      <path d="M170 165 H500" stroke="#dc2626"/>
      <path d="M170 195 H420 V240 H500" stroke="#9333ea"/>
    </g>
    <circle cx="440" cy="75" r="4" fill="#2563eb"/>
    <circle cx="455" cy="105" r="4" fill="#16a34a"/>
    <circle cx="470" cy="135" r="4" fill="#ea580c"/>

    <text x="340" y="378" text-anchor="middle" font-size="13" fill="#475569">SCK, MOSI and MISO are shared. Each device gets its own CS (chip select) wire.</text>
  </g>
</svg>
