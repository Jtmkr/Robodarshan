<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 500" role="img" aria-label="Debugging flowchart: ask five questions in order, power first, then sensors, motors, encoders and communication, to find which subsystem to test">
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker>
  </defs>
  <rect width="680" height="500" rx="12" fill="#f8fafc"/>
  <g font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1e293b" text-anchor="middle">
    <rect x="20" y="16" width="300" height="38" rx="19" fill="#334155"/>
    <text x="170" y="40" fill="#fff" font-weight="700">The robot misbehaves</text>
    <g fill="#e0ecff" stroke="#2563eb" stroke-width="2">
      <rect x="20" y="84" width="300" height="46" rx="9"/>
      <rect x="20" y="164" width="300" height="46" rx="9"/>
      <rect x="20" y="244" width="300" height="46" rx="9"/>
      <rect x="20" y="324" width="300" height="46" rx="9"/>
      <rect x="20" y="404" width="300" height="46" rx="9"/>
    </g>
    <g>
      <text x="170" y="112">Resets or dims when motors start?</text>
      <text x="170" y="192">Line sensor numbers wrong or jumpy?</text>
      <text x="170" y="272">One wheel faster, or robot veers?</text>
      <text x="170" y="352">Distance or turn angle is wrong?</text>
      <text x="170" y="432">A device is missing or sends garbage?</text>
    </g>
    <g fill="#dcfce7" stroke="#16a34a" stroke-width="2">
      <rect x="420" y="80" width="240" height="54" rx="9"/>
      <rect x="420" y="160" width="240" height="54" rx="9"/>
      <rect x="420" y="240" width="240" height="54" rx="9"/>
      <rect x="420" y="320" width="240" height="54" rx="9"/>
      <rect x="420" y="400" width="240" height="54" rx="9"/>
    </g>
    <g font-weight="700">
      <text x="540" y="103">Power issues</text>
      <text x="540" y="183">Sensor calibration</text>
      <text x="540" y="263">Motor matching</text>
      <text x="540" y="343">Encoder errors</text>
      <text x="540" y="423">Communication issues</text>
    </g>
    <g font-size="13" fill="#475569">
      <text x="540" y="123">measure VM and 5 V under load</text>
      <text x="540" y="203">print raw and calibrated values</text>
      <text x="540" y="283">equal PWM, compare counts</text>
      <text x="540" y="363">turn the wheel by hand</text>
      <text x="540" y="443">scan I2C, check wires and baud</text>
    </g>
    <g stroke="#334155" stroke-width="2.5" fill="none" marker-end="url(#a)">
      <line x1="170" y1="54" x2="170" y2="82"/>
      <line x1="170" y1="130" x2="170" y2="162"/>
      <line x1="170" y1="210" x2="170" y2="242"/>
      <line x1="170" y1="290" x2="170" y2="322"/>
      <line x1="170" y1="370" x2="170" y2="402"/>
      <line x1="320" y1="107" x2="418" y2="107"/>
      <line x1="320" y1="187" x2="418" y2="187"/>
      <line x1="320" y1="267" x2="418" y2="267"/>
      <line x1="320" y1="347" x2="418" y2="347"/>
      <line x1="320" y1="427" x2="418" y2="427"/>
    </g>
    <g font-size="13" font-weight="700">
      <g fill="#16a34a" text-anchor="middle">
        <text x="370" y="101">yes</text>
        <text x="370" y="181">yes</text>
        <text x="370" y="261">yes</text>
        <text x="370" y="341">yes</text>
        <text x="370" y="421">yes</text>
      </g>
      <g fill="#dc2626" text-anchor="start">
        <text x="180" y="150">no</text>
        <text x="180" y="230">no</text>
        <text x="180" y="310">no</text>
        <text x="180" y="390">no</text>
      </g>
    </g>
    <text x="170" y="474" fill="#475569" font-size="13">Still unsure? Test each subsystem alone, one at a time.</text>
    <text x="170" y="492" fill="#475569" font-size="13">Power goes first because it causes many other symptoms.</text>
  </g>
</svg>
