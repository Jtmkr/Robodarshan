    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="/js/supabase-client.js"></script>
    <script src="/js/auth.js"></script>
    <script>
        document.getElementById('logout-link').addEventListener('click', function (event) {
            event.preventDefault();
            logout();
        });

        function setError(message) {
            const errorEl = document.getElementById('register-error');
            errorEl.textContent = message;
            errorEl.style.display = message ? 'block' : 'none';
        }

        let currentUser = null;

        (async function init() {
            const user = await getSessionUser();
            if (!user) return; // getSessionUser() already redirected to login.html

            const { data: existingProfile, error } = await supabaseClient
                .from('users')
                .select('id')
                .eq('id', user.id)
                .maybeSingle();

            if (error) {
                console.error('Failed to check existing profile:', error.message);
                setError('Could not check your registration status. Please refresh and try again.');
                return;
            }

            if (existingProfile) {
                window.location.href = 'dashboard.html';
                return;
            }

            currentUser = user;
            document.getElementById('gsuite-email').value = user.email;
        })();

        document.getElementById('register-form').addEventListener('submit', async function (event) {
            event.preventDefault();
            setError('');

            if (!currentUser) {
                setError('Not signed in. Please refresh and try again.');
                return;
            }

            const submitButton = document.getElementById('register-submit');
            const file = document.getElementById('profile-picture').files[0];

            if (!file) {
                setError('Please select a profile picture.');
                return;
            }

            submitButton.disabled = true;
            submitButton.textContent = 'Registering...';

            try {
                const extension = (file.name.split('.').pop() || 'png').toLowerCase();
                const path = `${currentUser.id}/avatar.${extension}`;

                const { error: uploadError } = await supabaseClient.storage
                    .from('profile-pictures')
                    .upload(path, file, { upsert: true, contentType: file.type });

                if (uploadError) {
                    throw new Error(`Failed to upload profile picture: ${uploadError.message}`);
                }

                const {
                    data: { publicUrl },
                } = supabaseClient.storage.from('profile-pictures').getPublicUrl(path);

                const { error: insertError } = await supabaseClient.from('users').insert({
                    id: currentUser.id,
                    gsuite_email: currentUser.email,
                    name: document.getElementById('name').value.trim(),
                    mobile_number: document.getElementById('mobile-number').value.trim(),
                    enrollment_number: document.getElementById('enrollment-number').value.trim(),
                    personal_email: document.getElementById('personal-email').value.trim(),
                    profile_picture_url: publicUrl,
                    role: 'member',
                    total_xp: 0,
                });

                if (insertError) {
                    throw new Error(`Failed to save your registration: ${insertError.message}`);
                }

                window.location.href = 'dashboard.html';
            } catch (err) {
                console.error(err);
                setError(err.message);
                submitButton.disabled = false;
                submitButton.textContent = 'Complete Registration';
            }
        });
    </script>
