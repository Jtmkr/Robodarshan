<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 470" role="img" aria-label="Six line-maze junction types: left turn, right turn, T junction, cross, dead end and finish patch, each with the sensor pattern seen, what is seen after rolling forward, and the robot action">
<rect width="680" height="470" rx="12" fill="#f8fafc"/>
<g font-family="Arial, Helvetica, sans-serif" fill="#1e293b">
<rect x="14" y="14" width="208" height="214" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="26" y="37" font-size="15" font-weight="700">Left turn</text>
<g stroke="#334155" stroke-width="9" fill="none"><path d="M116 142 V92 H64"/></g>
<path d="M107 156 L125 156 L116 138 Z" fill="#16a34a"/>
<text x="26" y="172" font-size="13">Sensors: <tspan font-family="Courier New, monospace" font-weight="700">11111000</tspan></text>
<text x="26" y="193" font-size="13">After rolling: no line ahead</text>
<text x="26" y="215" font-size="14" font-weight="700" fill="#2563eb">turn LEFT</text>
<rect x="234" y="14" width="208" height="214" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="246" y="37" font-size="15" font-weight="700">Right turn</text>
<g stroke="#334155" stroke-width="9" fill="none"><path d="M336 142 V92 H388"/></g>
<path d="M327 156 L345 156 L336 138 Z" fill="#16a34a"/>
<text x="246" y="172" font-size="13">Sensors: <tspan font-family="Courier New, monospace" font-weight="700">00011111</tspan></text>
<text x="246" y="193" font-size="13">After rolling: no line ahead</text>
<text x="246" y="215" font-size="14" font-weight="700" fill="#2563eb">turn RIGHT</text>
<rect x="454" y="14" width="208" height="214" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="466" y="37" font-size="15" font-weight="700">T junction</text>
<g stroke="#334155" stroke-width="9" fill="none"><path d="M556 142 V92"/><path d="M504 92 H608"/></g>
<path d="M547 156 L565 156 L556 138 Z" fill="#16a34a"/>
<text x="466" y="172" font-size="13">Sensors: <tspan font-family="Courier New, monospace" font-weight="700">11111111</tspan></text>
<text x="466" y="193" font-size="13">After rolling: no line ahead</text>
<text x="466" y="215" font-size="14" font-weight="700" fill="#2563eb">turn LEFT</text>
<rect x="14" y="242" width="208" height="214" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="26" y="265" font-size="15" font-weight="700">Cross</text>
<g stroke="#334155" stroke-width="9" fill="none"><path d="M116 370 V284"/><path d="M64 320 H168"/></g>
<path d="M107 384 L125 384 L116 366 Z" fill="#16a34a"/>
<text x="26" y="400" font-size="13">Sensors: <tspan font-family="Courier New, monospace" font-weight="700">11111111</tspan></text>
<text x="26" y="421" font-size="13">After rolling: line continues</text>
<text x="26" y="443" font-size="14" font-weight="700" fill="#2563eb">turn LEFT</text>
<rect x="234" y="242" width="208" height="214" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="246" y="265" font-size="15" font-weight="700">Dead end</text>
<g stroke="#334155" stroke-width="9" fill="none"><path d="M336 370 V320"/></g>
<rect x="322" y="312" width="28" height="5" fill="#dc2626"/>
<path d="M327 384 L345 384 L336 366 Z" fill="#16a34a"/>
<text x="246" y="400" font-size="13">Sensors: <tspan font-family="Courier New, monospace" font-weight="700">00011000</tspan></text>
<text x="246" y="421" font-size="13">After rolling: all white</text>
<text x="246" y="443" font-size="14" font-weight="700" fill="#dc2626">U-TURN, mark it</text>
<rect x="454" y="242" width="208" height="214" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="466" y="265" font-size="15" font-weight="700">Finish patch</text>
<g stroke="#334155" stroke-width="9" fill="none"><path d="M556 370 V326"/></g>
<rect x="522" y="290" width="68" height="40" fill="#334155"/>
<path d="M547 384 L565 384 L556 366 Z" fill="#16a34a"/>
<text x="466" y="400" font-size="13">Sensors: <tspan font-family="Courier New, monospace" font-weight="700">11111111</tspan></text>
<text x="466" y="421" font-size="13">After rolling: still all dark</text>
<text x="466" y="443" font-size="14" font-weight="700" fill="#16a34a">STOP</text>
</g></svg>