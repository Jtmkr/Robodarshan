# Netlify settings. The site itself is plain static files served from the
# repository root, so no build command or publish directory is set here
# (anything set in the Netlify UI keeps applying).

[functions]
  directory = "netlify/functions"

# The AI assistant calls /api/chat; this maps it to the Netlify Function.
[[redirects]]
  from = "/api/chat"
  to = "/.netlify/functions/chat"
  status = 200

# The HTML pages moved into /pages. Keep the old addresses working
# (they only apply when no file exists at the old path).
[[redirects]]
  from = "/about.html"
  to = "/pages/about.html"
  status = 301

