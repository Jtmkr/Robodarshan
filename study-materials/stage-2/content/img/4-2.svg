<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 330" role="img" aria-label="Left: side view of a driven wheel showing weight pressing down, the floor pushing up with force N, and the friction force pushing the robot forward. Right: graph showing the force the floor can give rises with the motor force and then stops at mu times N, after which the wheel slips">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#16a34a"/></marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#dc2626"/></marker>
    <marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#9333ea"/></marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#334155"/></marker>
  </defs>
  <rect width="680" height="330" rx="12" fill="#f8fafc"/>
  <g font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#1e293b">
    <text x="165" y="28" text-anchor="middle" font-weight="700" font-size="14">Forces on a driven wheel</text>
    <text x="510" y="28" text-anchor="middle" font-weight="700" font-size="14">What the floor can give</text>

    <!-- wheel -->
    <circle cx="150" cy="165" r="60" fill="#e0ecff" stroke="#2563eb" stroke-width="3"/>
    <circle cx="150" cy="165" r="6" fill="#334155"/>
    <path d="M150 135 A30 30 0 0 1 180 165" fill="none" stroke="#9333ea" stroke-width="3" marker-end="url(#p)"/>
    <text x="190" y="150" fill="#9333ea" font-weight="700">T</text>
    <line x1="20" y1="225" x2="310" y2="225" stroke="#334155" stroke-width="4"/>

    <!-- weight -->
    <line x1="150" y1="48" x2="150" y2="100" stroke="#dc2626" stroke-width="3.5" marker-end="url(#r)"/>
    <text x="160" y="68" fill="#dc2626" font-weight="700">weight on wheel</text>
    <!-- normal force -->
    <line x1="150" y1="300" x2="150" y2="250" stroke="#334155" stroke-width="3.5" marker-end="url(#g)"/>
    <text x="160" y="295" fill="#334155" font-weight="700">N (floor pushes up)</text>
    <!-- friction -->
    <line x1="150" y1="240" x2="250" y2="240" stroke="#16a34a" stroke-width="3.5" marker-end="url(#a)"/>
    <text x="262" y="245" fill="#16a34a" font-weight="700">F</text>
    <text x="165" y="214" font-size="12" fill="#475569">r</text>
    <line x1="150" y1="165" x2="150" y2="222" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 3"/>

    <!-- graph axes -->
    <line x1="390" y1="270" x2="390" y2="55" stroke="#334155" stroke-width="2" marker-end="url(#g)"/>
    <line x1="390" y1="270" x2="655" y2="270" stroke="#334155" stroke-width="2" marker-end="url(#g)"/>
    <line x1="390" y1="130" x2="650" y2="130" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="397" y="121" font-weight="700" fill="#334155">limit = μ × N</text>
    <polyline points="390,270 530,130" fill="none" stroke="#16a34a" stroke-width="4"/>
    <polyline points="530,130 545,143 645,143" fill="none" stroke="#ea580c" stroke-width="4"/>
    <text x="455" y="215" fill="#16a34a" font-weight="700">grips</text>
    <text x="590" y="172" fill="#ea580c" font-weight="700">slips</text>
    <text x="522" y="298" text-anchor="middle" fill="#334155">force the motor asks for (T / r)</text>
    <text x="372" y="165" text-anchor="middle" fill="#334155" transform="rotate(-90 372 165)">force the floor gives</text>
  </g>
</svg>
