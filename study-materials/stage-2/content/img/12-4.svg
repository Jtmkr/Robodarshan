<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 440" role="img" aria-label="System map of the robot showing where each fault type lives: power, sensors, motors, encoders and communication around the ESP32">
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker>
    <marker id="r" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
  </defs>
  <rect width="680" height="440" rx="12" fill="#f8fafc"/>
  <g font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#1e293b" text-anchor="middle">
    <rect x="250" y="170" width="180" height="100" rx="10" fill="#e0ecff" stroke="#2563eb" stroke-width="2"/>
    <text x="340" y="206" font-size="16" font-weight="700">ESP32 + code</text>
    <text x="340" y="228" fill="#475569">reads, decides, drives</text>
    <text x="340" y="246" fill="#475569">(ISR, timing, logic bugs)</text>

    <g fill="#fff" stroke-width="2">
      <rect x="20" y="20" width="220" height="110" rx="10" stroke="#dc2626"/>
      <rect x="440" y="20" width="220" height="110" rx="10" stroke="#9333ea"/>
      <rect x="20" y="310" width="220" height="110" rx="10" stroke="#ea580c"/>
      <rect x="440" y="310" width="220" height="110" rx="10" stroke="#16a34a"/>
      <rect x="250" y="320" width="180" height="100" rx="10" stroke="#2563eb"/>
    </g>
    <g font-weight="700" font-size="15">
      <text x="130" y="44" fill="#dc2626">Power</text>
      <text x="550" y="44" fill="#9333ea">Line sensor</text>
      <text x="130" y="334" fill="#ea580c">Motors</text>
      <text x="550" y="334" fill="#16a34a">Encoders</text>
      <text x="340" y="344" fill="#2563eb">Communication</text>
    </g>
    <g fill="#475569">
      <text x="130" y="68">battery sag, brownout</text>
      <text x="130" y="86">hot regulator, loose plug</text>
      <text x="130" y="104">missing capacitors</text>
      <text x="550" y="68">bad min and max values</text>
      <text x="550" y="86">ambient light, height</text>
      <text x="550" y="104">dead or saturated channel</text>
      <text x="130" y="358">dead zone, one side faster</text>
      <text x="130" y="376">reversed polarity</text>
      <text x="130" y="394">worn or unequal motors</text>
      <text x="550" y="358">missed or extra counts</text>
      <text x="550" y="376">direction reversed, noise</text>
      <text x="550" y="394">loose or unpowered sensor</text>
      <text x="340" y="368">I2C address clash</text>
      <text x="340" y="386">missing pull-ups, stuck bus</text>
      <text x="340" y="404">baud, TX/RX swapped</text>
    </g>
    <g stroke="#334155" stroke-width="2.5" fill="none" marker-end="url(#a)">
      <line x1="500" y1="130" x2="400" y2="172"/>
      <line x1="400" y1="270" x2="480" y2="308"/>
      <line x1="280" y1="270" x2="200" y2="308"/>
      <line x1="340" y1="270" x2="340" y2="318"/>
    </g>
    <line x1="240" y1="90" x2="298" y2="168" stroke="#dc2626" stroke-width="2.5" marker-end="url(#r)"/>
    <path d="M60 130 L60 300" stroke="#dc2626" stroke-width="2.5" fill="none" marker-end="url(#r)"/>
    <text x="52" y="222" text-anchor="end" fill="#dc2626">VM</text>
    <text x="294" y="140" fill="#dc2626" text-anchor="start">5 V</text>
    <text x="474" y="160" fill="#9333ea">analog</text>
    <text x="442" y="288" fill="#16a34a" text-anchor="start">A, B</text>
    <text x="212" y="284" fill="#ea580c" text-anchor="start">PWM</text>
    <text x="368" y="300" fill="#2563eb" text-anchor="start">I2C, UART</text>
  </g>
</svg>
