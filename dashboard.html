    <script>
        document.getElementById('logout-link').addEventListener('click', function (event) {
            event.preventDefault();
            logout();
        });

        function esc(value) {
            const div = document.createElement('div');
            div.textContent = value ?? '';
            return div.innerHTML;
        }

        const ROBOT_ICON_SVG = `
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <rect x="4" y="8" width="16" height="12" rx="3" fill="#a685ff" />
                <circle cx="9" cy="14" r="1.6" fill="#0c0c0f" />
                <circle cx="15" cy="14" r="1.6" fill="#0c0c0f" />
                <rect x="10" y="2" width="4" height="4" rx="1" fill="#a685ff" />
                <line x1="12" y1="6" x2="12" y2="8" stroke="#a685ff" stroke-width="2" />
            </svg>
        `;

        (async function loadDashboard() {
            const user = await getCurrentUser();
            if (!user) return;

            const card = document.getElementById('dashboard-card');
            const profile = user.profile;
            const rookieThreshold = await getRookieXpThreshold();
            const display = getXpDisplay(profile.role, profile.total_xp, rookieThreshold);

            card.innerHTML = `
                <div class="dashboard-header">
                    <img src="${esc(profile.profile_picture_url)}" alt="" class="dashboard-avatar" />
                    <div class="dashboard-name">${esc(profile.name)}</div>
                    <div class="dashboard-email">${esc(profile.gsuite_email)}</div>
                </div>

                <div class="dashboard-rank-badge">${esc(display.badge)}</div>

                <div class="xp-bar-wrap">
                    <div class="xp-bar-track">
                        <div class="xp-bar-fill" id="xp-bar-fill"></div>
                        <div class="xp-bar-robot" id="xp-bar-robot">${ROBOT_ICON_SVG}</div>
                    </div>
                    <div class="xp-bar-labels">
                        <span class="xp-current">${esc(profile.total_xp)} XP</span>
                        <span>${esc(display.subLabel)}</span>
                    </div>
                </div>

                <dl class="dashboard-meta">
                    <dt>Enrollment Number</dt>
                    <dd>${esc(profile.enrollment_number)}</dd>
                </dl>

                <a href="/learning-portal.html" class="w-button">Go to Learning Portal</a>
            `;

            // Set the fill/robot position after the elements exist so the
            // width/left transition actually animates from 0 on load.
            requestAnimationFrame(() => {
                document.getElementById('xp-bar-fill').style.width = `${display.percent}%`;
                document.getElementById('xp-bar-robot').style.left = `${display.percent}%`;
            });

            await renderRoleSection(document.getElementById('role-section'), profile);
        })();
    </script>
