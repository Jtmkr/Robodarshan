<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 370" role="img" aria-label="Wiring between an ESP32, a TB6612FNG motor driver, two motors and a battery">
  <rect width="680" height="370" rx="12" fill="#f8fafc"/>
  <g font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#1e293b">
    <!-- ESP32 -->
    <rect x="30" y="36" width="150" height="296" rx="10" fill="#e0ecff" stroke="#2563eb" stroke-width="2"/>
    <text x="105" y="56" text-anchor="middle" font-weight="700" font-size="16">ESP32</text>
    <g text-anchor="end">
      <text x="172" y="75">GPIO25</text>
      <text x="172" y="105">GPIO26</text>
      <text x="172" y="135">GPIO27</text>
      <text x="172" y="165">GPIO13</text>
      <text x="172" y="195">GPIO32</text>
      <text x="172" y="225">GPIO33</text>
      <text x="172" y="255">GPIO4</text>
      <text x="172" y="285">3V3</text>
      <text x="172" y="315">GND</text>
    </g>

    <!-- TB6612FNG -->
    <rect x="330" y="36" width="130" height="296" rx="10" fill="#fff" stroke="#334155" stroke-width="2"/>
    <text x="395" y="56" text-anchor="middle" font-weight="700" font-size="14">TB6612FNG</text>
    <g>
      <text x="338" y="75">PWMA</text>
      <text x="338" y="105">AIN1</text>
      <text x="338" y="135">AIN2</text>
      <text x="338" y="165">PWMB</text>
      <text x="338" y="195">BIN1</text>
      <text x="338" y="225">BIN2</text>
      <text x="338" y="255">STBY</text>
      <text x="338" y="285">VCC</text>
      <text x="338" y="315">GND</text>
    </g>
    <g text-anchor="end">
      <text x="452" y="85">A01</text>
      <text x="452" y="115">A02</text>
      <text x="452" y="175">B01</text>
      <text x="452" y="205">B02</text>
      <text x="452" y="267">VM</text>
      <text x="452" y="307">GND</text>
    </g>

    <!-- control wires -->
    <g stroke-width="2.5">
      <line x1="180" y1="71" x2="330" y2="71" stroke="#2563eb"/>
      <line x1="180" y1="101" x2="330" y2="101" stroke="#16a34a"/>
      <line x1="180" y1="131" x2="330" y2="131" stroke="#16a34a"/>
      <line x1="180" y1="161" x2="330" y2="161" stroke="#2563eb"/>
      <line x1="180" y1="191" x2="330" y2="191" stroke="#16a34a"/>
      <line x1="180" y1="221" x2="330" y2="221" stroke="#16a34a"/>
      <line x1="180" y1="251" x2="330" y2="251" stroke="#ea580c"/>
      <line x1="180" y1="281" x2="330" y2="281" stroke="#dc2626"/>
      <line x1="180" y1="311" x2="330" y2="311" stroke="#111827"/>
    </g>

    <!-- motors -->
    <rect x="540" y="60" width="110" height="68" rx="8" fill="#fff" stroke="#334155" stroke-width="2"/>
    <text x="595" y="99" text-anchor="middle" font-weight="700">Motor A</text>
    <rect x="540" y="150" width="110" height="68" rx="8" fill="#fff" stroke="#334155" stroke-width="2"/>
    <text x="595" y="189" text-anchor="middle" font-weight="700">Motor B</text>
    <g stroke-width="2.5" stroke="#334155">
      <line x1="460" y1="81" x2="540" y2="81"/>
      <line x1="460" y1="111" x2="540" y2="111"/>
      <line x1="460" y1="171" x2="540" y2="171"/>
      <line x1="460" y1="201" x2="540" y2="201"/>
    </g>

    <!-- battery -->
    <rect x="540" y="240" width="110" height="82" rx="8" fill="#fff" stroke="#334155" stroke-width="2"/>
    <text x="595" y="276" text-anchor="middle" font-weight="700">Battery</text>
    <text x="595" y="296" text-anchor="middle" fill="#475569">(motor supply)</text>
    <text x="548" y="266" fill="#dc2626" font-weight="700">+</text>
    <text x="548" y="312" font-weight="700">−</text>
    <line x1="460" y1="263" x2="540" y2="263" stroke="#dc2626" stroke-width="2.5"/>
    <line x1="460" y1="303" x2="540" y2="303" stroke="#111827" stroke-width="2.5"/>

    <text x="340" y="356" text-anchor="middle" fill="#475569">The ESP32, the driver and the battery must all share one ground. Never power the motors from the ESP32.</text>
  </g>
</svg>
