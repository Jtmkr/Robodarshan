<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 380" role="img" aria-label="Left: an ultrasonic sensor sends a ping to a wall and measures the time until the echo returns, distance equals speed times time divided by two. Right: top view of a robot with three ultrasonic sensors pointing front, left and right, fired one after another.">
  <defs>
    <marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#ea580c"/></marker>
    <marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#9333ea"/></marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#334155"/></marker>
  </defs>
  <rect width="680" height="380" rx="12" fill="#f8fafc"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#1e293b">
    <line x1="340" y1="16" x2="340" y2="364" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="5 5"/>

    <!-- LEFT: time of flight -->
    <text x="20" y="34" font-size="15" font-weight="700">Time of flight</text>
    <polygon points="76,140 276,100 276,180" fill="#ea580c" fill-opacity="0.12"/>
    <rect x="22" y="100" width="40" height="80" rx="4" fill="#e0ecff" stroke="#2563eb" stroke-width="2"/>
    <circle cx="62" cy="124" r="13" fill="#e0ecff" stroke="#2563eb" stroke-width="2"/>
    <circle cx="62" cy="156" r="13" fill="#e0ecff" stroke="#2563eb" stroke-width="2"/>
    <text x="42" y="96" font-size="12" text-anchor="middle" fill="#475569">sensor</text>
    <rect x="276" y="70" width="14" height="140" fill="#334155"/>
    <text x="283" y="228" font-size="13" text-anchor="middle">wall</text>
    <line x1="86" y1="128" x2="268" y2="128" stroke="#ea580c" stroke-width="2.5" marker-end="url(#o)"/>
    <line x1="268" y1="152" x2="86" y2="152" stroke="#9333ea" stroke-width="2.5" marker-end="url(#p)"/>
    <text x="176" y="120" font-size="13" text-anchor="middle" fill="#c2410c" font-weight="700">ping</text>
    <text x="176" y="170" font-size="13" text-anchor="middle" fill="#7e22ce" font-weight="700">echo</text>
    <line x1="76" y1="200" x2="276" y2="200" stroke="#334155" stroke-width="2" marker-start="url(#g)" marker-end="url(#g)"/>
    <text x="176" y="220" font-size="14" text-anchor="middle" font-weight="700">d</text>
    <rect x="22" y="248" width="306" height="112" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="36" y="274" font-size="15" font-weight="700">d = v &#215; t / 2</text>
    <text x="36" y="296" font-size="13">v &#8776; 343 m/s in air at 20 &#176;C</text>
    <text x="36" y="316" font-size="13">t = ECHO pulse width, d in cm &#8776; t(&#181;s) / 58</text>
    <text x="36" y="336" font-size="13">Divide by 2: the sound goes there and back.</text>
    <text x="36" y="354" font-size="12" fill="#475569">Beam is about 15&#176; wide; very close walls are not seen.</text>

    <!-- RIGHT: robot with three sensors -->
    <text x="360" y="34" font-size="15" font-weight="700">Three sensors on the robot (top view)</text>
    <!-- walls -->
    <g fill="#334155">
      <rect x="372" y="150" width="10" height="170"/>
      <rect x="640" y="150" width="10" height="170"/>
      <rect x="440" y="62" width="140" height="10"/>
    </g>
    <!-- cones -->
    <g fill="#ea580c" fill-opacity="0.14">
      <polygon points="510,200 495,72 525,72"/>
      <polygon points="468,262 382,247 382,277"/>
      <polygon points="552,262 640,247 640,277"/>
    </g>
    <!-- robot -->
    <rect x="468" y="196" width="84" height="110" rx="10" fill="#e0ecff" stroke="#2563eb" stroke-width="2.5"/>
    <g fill="#16a34a"><path d="M510 214 L520 232 L500 232 Z"/></g>
    <text x="510" y="264" font-size="13" text-anchor="middle">robot</text>
    <g fill="#ea580c">
      <circle cx="510" cy="198" r="7"/>
      <circle cx="470" cy="262" r="7"/>
      <circle cx="550" cy="262" r="7"/>
    </g>
    <g font-size="14" font-weight="700" text-anchor="middle" fill="#c2410c">
      <text x="510" y="116">F</text>
      <text x="426" y="240">L</text>
      <text x="596" y="240">R</text>
    </g>
    <text x="510" y="336" font-size="13" text-anchor="middle" font-weight="700">fire one at a time</text>
    <text x="510" y="355" font-size="13" text-anchor="middle">1 front, 2 left, 3 right, then repeat</text>
  </g>
</svg>
