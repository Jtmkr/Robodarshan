<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 305" role="img" aria-label="Block diagram of a PID loop: setpoint minus measured output gives the error, which feeds the P, I and D terms; their sum drives the motor and robot, and a sensor feeds the measurement back">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#334155"/></marker></defs>
<rect width="680" height="305" rx="12" fill="#f8fafc"/>
<g font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1e293b">
<text x="14" y="104" font-size="14" font-weight="700">Setpoint r</text>
<line x1="20" y1="125" x2="79" y2="125" stroke="#334155" stroke-width="2.5" marker-end="url(#a)"/>
<circle cx="95" cy="125" r="16" fill="#fff" stroke="#334155" stroke-width="2"/><text x="95" y="130" text-anchor="middle" font-size="16">&#931;</text>
<text x="68" y="119" font-size="14">+</text><text x="102" y="160" font-size="16">&#8722;</text>
<text x="128" y="112" text-anchor="middle" font-size="12" font-weight="700" fill="#dc2626">error e</text>
<line x1="111" y1="125" x2="160" y2="125" stroke="#334155" stroke-width="2.5"/>
<line x1="160" y1="65" x2="160" y2="195" stroke="#334155" stroke-width="2.5"/>
<line x1="160" y1="65" x2="183" y2="65" stroke="#334155" stroke-width="2.5" marker-end="url(#a)"/>
<rect x="185" y="39" width="140" height="52" rx="9" fill="#e0ecff" stroke="#2563eb" stroke-width="2"/>
<text x="255" y="60" text-anchor="middle" font-weight="700">P  (present)</text><text x="255" y="80" text-anchor="middle" font-size="13">Kp &#215; e</text>
<line x1="325" y1="65" x2="352" y2="65" stroke="#334155" stroke-width="2.5"/>
<line x1="160" y1="125" x2="183" y2="125" stroke="#334155" stroke-width="2.5" marker-end="url(#a)"/>
<rect x="185" y="99" width="140" height="52" rx="9" fill="#e0ecff" stroke="#2563eb" stroke-width="2"/>
<text x="255" y="120" text-anchor="middle" font-weight="700">I  (past)</text><text x="255" y="140" text-anchor="middle" font-size="13">Ki &#215; &#8747; e dt</text>
<line x1="325" y1="125" x2="352" y2="125" stroke="#334155" stroke-width="2.5"/>
<line x1="160" y1="195" x2="183" y2="195" stroke="#334155" stroke-width="2.5" marker-end="url(#a)"/>
<rect x="185" y="169" width="140" height="52" rx="9" fill="#e0ecff" stroke="#2563eb" stroke-width="2"/>
<text x="255" y="190" text-anchor="middle" font-weight="700">D  (trend)</text><text x="255" y="210" text-anchor="middle" font-size="13">Kd &#215; de/dt</text>
<line x1="325" y1="195" x2="352" y2="195" stroke="#334155" stroke-width="2.5"/>
<line x1="352" y1="65" x2="352" y2="195" stroke="#334155" stroke-width="2.5"/>
<line x1="352" y1="125" x2="378" y2="125" stroke="#334155" stroke-width="2.5" marker-end="url(#a)"/>
<circle cx="394" cy="125" r="16" fill="#fff" stroke="#334155" stroke-width="2"/><text x="394" y="130" text-anchor="middle" font-size="16">&#931;</text>
<line x1="410" y1="125" x2="444" y2="125" stroke="#334155" stroke-width="2.5" marker-end="url(#a)"/>
<text x="428" y="112" text-anchor="middle" font-size="13" font-weight="700" fill="#ea580c">u</text>
<rect x="446" y="93" width="110" height="64" rx="9" fill="#e0ecff" stroke="#2563eb" stroke-width="2"/>
<text x="501" y="121" text-anchor="middle" font-weight="700">Motor +</text><text x="501" y="140" text-anchor="middle" font-weight="700">robot</text>
<line x1="556" y1="125" x2="640" y2="125" stroke="#334155" stroke-width="2.5" marker-end="url(#a)"/>
<text x="612" y="112" text-anchor="middle" font-size="15" font-weight="700">y</text><text x="612" y="148" text-anchor="middle" font-size="12" fill="#475569">output</text>
<circle cx="600" cy="125" r="4" fill="#334155"/>
<path d="M600 125 V248 H420" fill="none" stroke="#334155" stroke-width="2.5"/>
<rect x="300" y="226" width="120" height="44" rx="9" fill="#e0ecff" stroke="#16a34a" stroke-width="2"/><text x="360" y="246" text-anchor="middle" font-weight="700">Sensor</text><text x="360" y="262" text-anchor="middle" font-size="12">measures y</text>
<path d="M300 248 H95 V143" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#a)"/>
<text x="20" y="288" font-size="13" fill="#475569">e = r &#8722; y (setpoint minus measurement)      u = Kp&#183;e + Ki&#183;&#8747;e dt + Kd&#183;de/dt</text>
</g>
</svg>
