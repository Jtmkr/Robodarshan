<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 330" role="img" aria-label="Comparison of a linear regulator and a buck converter making 3.3 volts at 0.2 amps from 12 volts: the linear regulator draws 2.4 watts and wastes 1.74 watts as heat, a 27.5 percent efficiency, while a buck converter at about 90 percent efficiency draws about 0.73 watts">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#334155"/></marker>
  </defs>
  <rect width="680" height="330" rx="12" fill="#f8fafc"/>
  <g font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#1e293b">
    <line x1="340" y1="20" x2="340" y2="310" stroke="#cbd5e1" stroke-width="2"/>

    <!-- LEFT: linear -->
    <text x="180" y="32" text-anchor="middle" font-weight="700" font-size="15">Linear regulator (LDO)</text>
    <text x="40" y="90" text-anchor="middle">12 V</text>
    <line x1="64" y1="85" x2="105" y2="85" stroke="#334155" stroke-width="3" marker-end="url(#a)"/>
    <rect x="107" y="55" width="130" height="60" rx="10" fill="#e0ecff" stroke="#2563eb" stroke-width="2"/>
    <text x="172" y="82" text-anchor="middle" font-weight="700">Linear</text>
    <text x="172" y="100" text-anchor="middle" font-size="12">burns the extra volts</text>
    <line x1="239" y1="85" x2="278" y2="85" stroke="#334155" stroke-width="3" marker-end="url(#a)"/>
    <text x="302" y="82" text-anchor="middle">3.3 V</text>
    <text x="302" y="100" text-anchor="middle">0.2 A</text>

    <text x="30" y="160" font-size="12" fill="#475569">Power taken from the battery: 12 V × 0.2 A = 2.4 W</text>
    <rect x="30" y="170" width="77" height="30" fill="#bbf7d0" stroke="#16a34a" stroke-width="2"/>
    <rect x="107" y="170" width="203" height="30" fill="#fed7aa" stroke="#ea580c" stroke-width="2"/>
    <text x="68" y="190" text-anchor="middle">0.66 W</text>
    <text x="208" y="190" text-anchor="middle">heat 1.74 W</text>
    <text x="30" y="218" font-size="12" fill="#16a34a">useful (3.3 V × 0.2 A)</text>

    <g font-weight="700">
      <text x="30" y="255">Efficiency = 3.3 / 12 = 27.5 %</text>
    </g>
    <text x="30" y="276">Battery current = 0.20 A</text>
    <text x="30" y="297">Gets hot. Quiet output, very simple.</text>

    <!-- RIGHT: buck -->
    <text x="510" y="32" text-anchor="middle" font-weight="700" font-size="15">Buck converter</text>
    <text x="370" y="90" text-anchor="middle">12 V</text>
    <line x1="394" y1="85" x2="435" y2="85" stroke="#334155" stroke-width="3" marker-end="url(#a)"/>
    <rect x="437" y="55" width="130" height="60" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="502" y="82" text-anchor="middle" font-weight="700">Buck</text>
    <text x="502" y="100" text-anchor="middle" font-size="12">switches + inductor</text>
    <line x1="569" y1="85" x2="608" y2="85" stroke="#334155" stroke-width="3" marker-end="url(#a)"/>
    <text x="632" y="82" text-anchor="middle">3.3 V</text>
    <text x="632" y="100" text-anchor="middle">0.2 A</text>

    <text x="360" y="160" font-size="12" fill="#475569">Power taken from the battery: 0.66 W / 0.9 = 0.73 W</text>
    <rect x="360" y="170" width="77" height="30" fill="#bbf7d0" stroke="#16a34a" stroke-width="2"/>
    <rect x="437" y="170" width="9" height="30" fill="#fed7aa" stroke="#ea580c" stroke-width="2"/>
    <text x="398" y="190" text-anchor="middle">0.66 W</text>
    <text x="446" y="218" font-size="12" fill="#ea580c">heat 0.07 W</text>
    <text x="360" y="218" font-size="12" fill="#16a34a">useful</text>

    <g font-weight="700">
      <text x="360" y="255">Efficiency about 90 % (assumed)</text>
    </g>
    <text x="360" y="276">Battery current = 0.73 W / 12 V = 0.06 A</text>
    <text x="360" y="297">Cool, but adds switching ripple.</text>
  </g>
</svg>
