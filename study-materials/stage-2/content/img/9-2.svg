<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 340" role="img" aria-label="Path recording: a robot drives from the start to a T junction, turns left into a dead end, makes a U-turn, returns to the same junction, and continues to the finish. Next to the map are the nodes and edges stored in memory, with distances in millimetres.">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#ea580c"/></marker>
  </defs>
  <rect width="680" height="340" rx="12" fill="#f8fafc"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#1e293b">
    <!-- road -->
    <g stroke="#cbd5e1" stroke-width="12" fill="none" stroke-linecap="butt">
      <path d="M200 280 V120"/>
      <path d="M80 120 H320"/>
    </g>
    <rect x="68" y="112" width="6" height="16" fill="#dc2626"/>
    <rect x="320" y="104" width="30" height="32" fill="#334155"/>
    <!-- travelled route -->
    <g stroke="#ea580c" stroke-width="2.5" fill="none" marker-end="url(#a)">
      <path d="M194 270 V132" />
      <path d="M190 114 H92" />
      <path d="M92 126 H190" />
      <path d="M210 120 H312" />
    </g>
    <!-- nodes -->
    <g fill="#e0ecff" stroke="#2563eb" stroke-width="2.5">
      <circle cx="200" cy="280" r="14"/>
      <circle cx="200" cy="120" r="14"/>
      <circle cx="80" cy="120" r="14" fill="#fee2e2" stroke="#dc2626"/>
      <circle cx="320" cy="120" r="14" fill="#dcfce7" stroke="#16a34a"/>
    </g>
    <g font-size="14" font-weight="700" text-anchor="middle">
      <text x="200" y="285">0</text>
      <text x="200" y="125">1</text>
      <text x="80" y="125">2</text>
      <text x="320" y="125">3</text>
    </g>
    <!-- labels -->
    <g font-size="13" fill="#334155">
      <text x="212" y="205">300 mm</text>
      <text x="126" y="98" text-anchor="middle">240 mm</text>
      <text x="266" y="98" text-anchor="middle">240 mm</text>
      <text x="80" y="160" text-anchor="middle" fill="#dc2626" font-weight="700">dead end</text>
      <text x="320" y="160" text-anchor="middle" fill="#16a34a" font-weight="700">finish</text>
      <text x="200" y="316" text-anchor="middle" font-weight="700">start</text>
    </g>
    <g font-size="13" fill="#ea580c" font-weight="700">
      <text x="30" y="40">1 follow line, T seen: turn LEFT</text>
      <text x="30" y="60">2 dead end: U-turn</text>
      <text x="30" y="78">3 back at (0, 300): same node 1, go straight</text>
    </g>
    <!-- stored data -->
    <rect x="384" y="20" width="276" height="300" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="398" y="46" font-size="14" font-weight="700">Stored in RAM</text>
    <g font-family="Courier New, monospace" font-size="12" fill="#1e293b">
<text x="398" y="76" font-weight="700">nodes[]</text><text x="512" y="76" text-anchor="end" font-weight="700">x(mm)</text><text x="560" y="76" text-anchor="end" font-weight="700">y(mm)</text><text x="572" y="76" font-weight="700">kind</text>
<text x="398" y="98">0</text><text x="512" y="98" text-anchor="end">0</text><text x="560" y="98" text-anchor="end">0</text><text x="572" y="98">START</text>
<text x="398" y="118">1</text><text x="512" y="118" text-anchor="end">0</text><text x="560" y="118" text-anchor="end">300</text><text x="572" y="118">JUNCTION</text>
<text x="398" y="138">2</text><text x="512" y="138" text-anchor="end">-240</text><text x="560" y="138" text-anchor="end">300</text><text x="572" y="138">DEAD_END</text>
<text x="398" y="158">3</text><text x="512" y="158" text-anchor="end">240</text><text x="560" y="158" text-anchor="end">300</text><text x="572" y="158">FINISH</text>
<text x="398" y="196" font-weight="700">edges[]</text><text x="470" y="196" font-weight="700">a-b</text><text x="560" y="196" text-anchor="end" font-weight="700">len(mm)</text><text x="580" y="196" font-weight="700">dir</text>
<text x="470" y="218">0-1</text><text x="560" y="218" text-anchor="end">300</text><text x="580" y="218">N</text>
<text x="470" y="238">1-2</text><text x="560" y="238" text-anchor="end">240</text><text x="580" y="238">W</text>
<text x="470" y="258">1-3</text><text x="560" y="258" text-anchor="end">240</text><text x="580" y="258">E</text>
</g>
    <text x="398" y="290" font-size="12" fill="#475569">x east, y north; dir = heading when leaving a.</text>
    <text x="398" y="308" font-size="12" fill="#475569">The return trip 2 to 1 reuses edge 1-2.</text>
  </g>
</svg>
