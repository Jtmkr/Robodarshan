    <script>
        document.getElementById('logout-link').addEventListener('click', function (event) {
            event.preventDefault();
            logout();
        });

        function esc(value) {
            const div = document.createElement('div');
            div.textContent = value ?? '';
            return div.innerHTML;
        }

        function renderProfileHero(profile, display) {
            const card = document.getElementById('dashboard-card');

            card.innerHTML = `
                <div class="profile-hero-main">
                    <img src="${esc(profile.profile_picture_url)}" alt="" class="profile-avatar" />
                    <div class="profile-identity">
                        <div class="profile-name-row">
                            <h2 class="profile-name">${esc(profile.name)}</h2>
                            <span class="role-badge">${esc(display.badge)}</span>
                        </div>
                        <div class="profile-email">${esc(profile.gsuite_email)}</div>
                        <div class="profile-enrollment">Enrollment No. <strong>${esc(profile.enrollment_number)}</strong></div>
                    </div>
                </div>

                <div class="profile-progress">
                    <div class="profile-progress-top">
                        <span>Learning Progress</span>
                        <span class="xp-value">${esc(profile.total_xp)} XP</span>
                    </div>
                    <div class="progress-track">
                        <div class="progress-fill" id="xp-bar-fill"></div>
                    </div>
                    <div class="profile-progress-sub">${esc(display.subLabel)}</div>
                </div>

                <a href="/learning-portal.html" class="btn btn-primary profile-cta">Go to Learning Portal</a>
            `;

            // Set the fill width after the element exists so the width
            // transition actually animates from 0 on load.
            requestAnimationFrame(() => {
                document.getElementById('xp-bar-fill').style.width = `${display.percent}%`;
            });
        }

        (async function loadDashboard() {
            const user = await getCurrentUser();
            if (!user) return;

            const profile = user.profile;
            const rookieThreshold = await getRookieXpThreshold();
            const display = getXpDisplay(profile.role, profile.total_xp, rookieThreshold);

            renderProfileHero(profile, display);

            renderProfileEditSection(document.getElementById('profile-edit-section'), profile, (updated) => {
                Object.assign(profile, updated);
                renderProfileHero(profile, display);
            });

            await renderRoleSection(document.getElementById('role-section'), profile);
        })();
    </script>
