<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 370" role="img" aria-label="Speed profile for moving a set distance: PWM ramps up, cruises, slows down in proportion to the remaining distance, creeps at the minimum PWM, and stops inside a tolerance band at the target. A dashed red line shows overshoot if the robot arrives too fast.">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#334155"/></marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker>
  </defs>
  <rect width="680" height="370" rx="12" fill="#f8fafc"/>
  <g font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#1e293b">
    <text x="340" y="24" text-anchor="middle" font-weight="700" font-size="15">moveDistance(): speed command along the way</text>
    <!-- tolerance band -->
    <rect x="548" y="90" width="24" height="210" fill="#dcfce7"/>
    <!-- axes -->
    <line x1="80" y1="300" x2="660" y2="300" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
    <line x1="80" y1="300" x2="80" y2="80" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
    <text x="74" y="151" text-anchor="end" font-size="12">maxPwm</text>
    <text x="74" y="258" text-anchor="end" font-size="12">MIN_PWM</text>
    <text x="80" y="62" text-anchor="middle">PWM command</text>
    <text x="80" y="318" text-anchor="middle" font-size="12">0</text>
    <text x="560" y="318" text-anchor="middle" font-size="12">target</text>
    <text x="340" y="344" text-anchor="middle">distance travelled (encoder ticks, from 0 to the target)</text>
    <!-- zone separators -->
    <g stroke="#94a3b8" stroke-width="1" stroke-dasharray="3 3">
      <line x1="180" y1="90" x2="180" y2="300"/><line x1="400" y1="90" x2="400" y2="300"/><line x1="500" y1="90" x2="500" y2="300"/>
    </g>
    <g text-anchor="middle" fill="#475569" font-size="12">
      <text x="130" y="106">1 ramp up</text><text x="290" y="106">2 cruise</text><text x="450" y="106">3 slow down</text><text x="528" y="82">4 creep</text>
    </g>
    <!-- profile -->
    <path d="M80 300 V254 L180 151 H400 L500 254 H560 V300" fill="none" stroke="#2563eb" stroke-width="3"/>
    <!-- overshoot -->
    <path d="M560 254 H620" fill="none" stroke="#dc2626" stroke-width="3" stroke-dasharray="6 4" marker-end="url(#r)"/>
    <text x="640" y="236" text-anchor="end" fill="#dc2626" font-weight="700" font-size="12">overshoot:</text>
    <text x="640" y="278" text-anchor="end" fill="#dc2626" font-weight="700" font-size="12">coasts past</text>
    <text x="560" y="186" text-anchor="middle" fill="#16a34a" font-weight="700" font-size="12" transform="rotate(-90 566 186)">stop tolerance</text>
  </g>
</svg>
