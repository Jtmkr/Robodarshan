<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 370" role="img" aria-label="Power distribution block diagram: the 3S LiPo battery goes through a fuse and switch, then splits into three branches: directly to the TB6612FNG motor driver and motors, through a 12 V to 5 V buck converter to the ESP32 and its 3.3 V sensors, and through a resistor divider to an ESP32 analog pin">
  <defs>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#dc2626"/></marker>
    <marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#ea580c"/></marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#16a34a"/></marker>
  </defs>
  <rect width="680" height="370" rx="12" fill="#f8fafc"/>
  <g font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#1e293b" text-anchor="middle">
    <!-- battery -->
    <rect x="20" y="140" width="110" height="70" rx="10" fill="#fed7aa" stroke="#ea580c" stroke-width="2"/>
    <text x="75" y="166" font-weight="700" font-size="15">3S LiPo</text>
    <text x="75" y="184" font-size="12">2200 mAh</text>
    <text x="75" y="200" font-size="12">11.1 V / 12.6 V</text>
    <!-- fuse + switch -->
    <rect x="160" y="145" width="100" height="60" rx="10" fill="#e0ecff" stroke="#2563eb" stroke-width="2"/>
    <text x="210" y="171" font-weight="700">Fuse +</text>
    <text x="210" y="189" font-weight="700">switch</text>

    <!-- trunk -->
    <g stroke="#dc2626" stroke-width="3" fill="none">
      <line x1="130" y1="175" x2="160" y2="175" marker-end="url(#r)"/>
      <line x1="260" y1="175" x2="295" y2="175"/>
      <line x1="295" y1="60" x2="295" y2="280"/>
      <line x1="295" y1="60" x2="338" y2="60" marker-end="url(#r)"/>
      <line x1="295" y1="175" x2="338" y2="175" marker-end="url(#r)"/>
      <line x1="295" y1="280" x2="338" y2="280" marker-end="url(#r)"/>
    </g>
    <text x="320" y="48" font-size="12" fill="#dc2626">VM</text>

    <!-- motor driver -->
    <rect x="340" y="30" width="120" height="60" rx="10" fill="#fff" stroke="#334155" stroke-width="2"/>
    <text x="400" y="56" font-weight="700">TB6612FNG</text>
    <text x="400" y="74" font-size="12">+ bulk capacitor</text>
    <line x1="460" y1="60" x2="520" y2="60" stroke="#334155" stroke-width="3" marker-end="url(#o)"/>
    <rect x="522" y="30" width="143" height="60" rx="10" fill="#fff" stroke="#334155" stroke-width="2"/>
    <text x="593" y="56" font-weight="700">2 × N20 motors</text>
    <text x="593" y="74" font-size="12">up to the stall current</text>

    <!-- buck -->
    <rect x="340" y="145" width="120" height="60" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="400" y="171" font-weight="700">Buck converter</text>
    <text x="400" y="189" font-size="12">12 V to 5 V</text>
    <line x1="460" y1="165" x2="508" y2="165" stroke="#16a34a" stroke-width="3" marker-end="url(#g)"/>
    <text x="484" y="156" font-size="12" fill="#16a34a">5 V</text>

    <!-- esp32 -->
    <rect x="510" y="135" width="155" height="80" rx="10" fill="#e0ecff" stroke="#2563eb" stroke-width="2"/>
    <text x="587" y="162" font-weight="700" font-size="15">ESP32 DevKit</text>
    <text x="587" y="180" font-size="12">5 V into VIN</text>
    <text x="587" y="198" font-size="12">makes 3.3 V on board</text>

    <!-- sensors -->
    <line x1="587" y1="215" x2="587" y2="250" stroke="#16a34a" stroke-width="3" marker-end="url(#g)"/>
    <text x="600" y="237" text-anchor="start" font-size="12" fill="#16a34a">3V3</text>
    <rect x="510" y="252" width="155" height="76" rx="10" fill="#fff" stroke="#334155" stroke-width="2"/>
    <text x="587" y="274" font-weight="700">3.3 V loads</text>
    <text x="587" y="292" font-size="12">QTR-8A, 2 × ADS1115</text>
    <text x="587" y="308" font-size="12">MPU6050, OLED, encoders</text>

    <!-- divider -->
    <rect x="340" y="250" width="120" height="60" rx="10" fill="#fff" stroke="#334155" stroke-width="2"/>
    <text x="400" y="276" font-weight="700">Voltage divider</text>
    <text x="400" y="294" font-size="12">47 kΩ + 12 kΩ</text>
    <path d="M460 280 H485 V195 H508" fill="none" stroke="#9333ea" stroke-width="3" marker-end="url(#r)"/>
    <text x="400" y="328" font-size="12" fill="#9333ea">output goes to an ADC1 pin</text>

    <text x="340" y="354" font-size="12" fill="#475569">Only the positive wiring is drawn. All grounds are joined together at one point (see the star ground section).</text>
  </g>
</svg>
