<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 330" role="img" aria-label="PCB design flow from idea to ordered board: block diagram, schematic, ERC, footprints, layout and routing, DRC, Gerber export and viewing, order">
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker>
  </defs>
  <rect width="680" height="330" rx="12" fill="#f8fafc"/>
  <g font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1e293b" text-anchor="middle">
    <g fill="#e0ecff" stroke="#2563eb" stroke-width="2">
      <rect x="20" y="40" width="130" height="64" rx="9"/>
      <rect x="190" y="40" width="130" height="64" rx="9"/>
      <rect x="360" y="40" width="130" height="64" rx="9"/>
      <rect x="530" y="40" width="130" height="64" rx="9"/>
      <rect x="20" y="190" width="130" height="64" rx="9"/>
      <rect x="190" y="190" width="130" height="64" rx="9"/>
    </g>
    <g fill="#dcfce7" stroke="#16a34a" stroke-width="2">
      <rect x="360" y="190" width="130" height="64" rx="9"/>
      <rect x="530" y="190" width="130" height="64" rx="9"/>
    </g>
    <g font-weight="700">
      <text x="85" y="68">1. Idea</text>
      <text x="255" y="68">2. Schematic</text>
      <text x="425" y="68">3. ERC</text>
      <text x="595" y="68">4. Footprints</text>
      <text x="85" y="218">5. Layout</text>
      <text x="255" y="218">6. Routing</text>
      <text x="425" y="218">7. DRC</text>
      <text x="595" y="218">8. Gerber + drill</text>
    </g>
    <g font-size="13" fill="#475569">
      <text x="85" y="88">block diagram</text>
      <text x="255" y="88">symbols, wires, nets</text>
      <text x="425" y="88">electrical rules check</text>
      <text x="595" y="88">match the real parts</text>
      <text x="85" y="238">outline, placement</text>
      <text x="255" y="238">traces, pour, vias</text>
      <text x="425" y="238">design rules check</text>
      <text x="595" y="238">view, then order</text>
    </g>
    <g stroke="#334155" stroke-width="2.5" fill="none" marker-end="url(#a)">
      <line x1="150" y1="72" x2="188" y2="72"/>
      <line x1="320" y1="72" x2="358" y2="72"/>
      <line x1="490" y1="72" x2="528" y2="72"/>
      <path d="M595 104 L595 140 L85 140 L85 188"/>
      <line x1="150" y1="222" x2="188" y2="222"/>
      <line x1="320" y1="222" x2="358" y2="222"/>
      <line x1="490" y1="222" x2="528" y2="222"/>
    </g>
    <g stroke="#ea580c" stroke-width="2" fill="none" stroke-dasharray="6 4" marker-end="url(#a)">
      <path d="M425 254 L425 285 L255 285 L255 256"/>
    </g>
    <text x="340" y="304" fill="#ea580c" font-size="13">errors found: go back and fix, then run the check again</text>
    <text x="340" y="162" fill="#475569" font-size="13">update PCB from schematic</text>
  </g>
</svg>
