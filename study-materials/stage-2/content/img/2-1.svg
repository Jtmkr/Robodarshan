<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 104 680 256" role="img" aria-label="State machine of a line follower with four states: IDLE, FOLLOW, LOST and STOP, and the conditions that move between them">
  <defs>
    <marker id="s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#334155"/></marker>
  </defs>
  <rect width="680" height="360" rx="12" fill="#f8fafc"/>
  <g font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1e293b">
    <!-- states -->
    <g fill="#e0ecff" stroke="#2563eb" stroke-width="2">
      <rect x="40" y="130" width="130" height="64" rx="10"/>
      <rect x="275" y="130" width="130" height="64" rx="10"/>
      <rect x="510" y="130" width="130" height="64" rx="10"/>
      <rect x="275" y="262" width="130" height="64" rx="10"/>
    </g>
    <g text-anchor="middle">
      <text x="105" y="158" font-weight="700" font-size="16">IDLE</text>
      <text x="105" y="178" font-size="12" fill="#475569">motors off</text>
      <text x="340" y="158" font-weight="700" font-size="16">FOLLOW</text>
      <text x="340" y="178" font-size="12" fill="#475569">run the controller</text>
      <text x="575" y="158" font-weight="700" font-size="16">LOST</text>
      <text x="575" y="178" font-size="12" fill="#475569">search for the line</text>
      <text x="340" y="290" font-weight="700" font-size="16">STOP</text>
      <text x="340" y="310" font-size="12" fill="#475569">motors off</text>
    </g>

    <!-- start marker -->
    <circle cx="20" cy="162" r="5" fill="#334155"/>
    <line x1="25" y1="162" x2="38" y2="162" stroke="#334155" stroke-width="2.5" marker-end="url(#s)"/>

    <!-- transitions -->
    <g stroke="#334155" stroke-width="2.5" fill="none" marker-end="url(#s)">
      <path d="M170 162 H273"/>
      <path d="M405 146 H508"/>
      <path d="M510 180 H407"/>
      <path d="M340 194 V260"/>
      <path d="M575 194 V294 H407"/>
    </g>
    <g font-size="12" fill="#334155" text-anchor="middle">
      <text x="222" y="152">button</text>
      <text x="457" y="136">line lost</text>
      <text x="457" y="200">line found</text>
      <text x="383" y="232" text-anchor="start">finish marker</text>
      <text x="492" y="284">lost for 1 s</text>
    </g>

    <text x="340" y="348" text-anchor="middle" font-size="13" fill="#475569">One state = one behaviour. Each arrow is the condition that moves the robot to the next state.</text>
  </g>
</svg>
