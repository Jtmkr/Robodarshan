<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 370" role="img" aria-label="Graph of steering correction against line position: bang-bang is a step of fixed size with a dead band in the middle, proportional steering is a straight line through zero">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#334155"/></marker></defs>
<rect width="680" height="370" rx="12" fill="#f8fafc"/>
<g font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1e293b">
<rect x="70" y="40" width="560" height="270" fill="#ffffff" stroke="#94a3b8"/>
<line x1="70.0" y1="40" x2="70.0" y2="310" stroke="#e2e8f0"/><text x="70.0" y="326" text-anchor="middle" font-size="12" fill="#475569">-3500</text>
<line x1="190.0" y1="40" x2="190.0" y2="310" stroke="#e2e8f0"/><text x="190.0" y="326" text-anchor="middle" font-size="12" fill="#475569">-2000</text>
<line x1="350.0" y1="40" x2="350.0" y2="310" stroke="#e2e8f0"/><text x="350.0" y="326" text-anchor="middle" font-size="12" fill="#475569">0</text>
<line x1="510.0" y1="40" x2="510.0" y2="310" stroke="#e2e8f0"/><text x="510.0" y="326" text-anchor="middle" font-size="12" fill="#475569">2000</text>
<line x1="630.0" y1="40" x2="630.0" y2="310" stroke="#e2e8f0"/><text x="630.0" y="326" text-anchor="middle" font-size="12" fill="#475569">3500</text>
<line x1="70" y1="287.5" x2="630" y2="287.5" stroke="#e2e8f0"/><text x="64" y="291.5" text-anchor="end" font-size="12" fill="#475569">-100</text>
<line x1="70" y1="231.2" x2="630" y2="231.2" stroke="#e2e8f0"/><text x="64" y="235.2" text-anchor="end" font-size="12" fill="#475569">-50</text>
<line x1="70" y1="175.0" x2="630" y2="175.0" stroke="#e2e8f0"/><text x="64" y="179.0" text-anchor="end" font-size="12" fill="#475569">0</text>
<line x1="70" y1="118.8" x2="630" y2="118.8" stroke="#e2e8f0"/><text x="64" y="122.8" text-anchor="end" font-size="12" fill="#475569">50</text>
<line x1="70" y1="62.5" x2="630" y2="62.5" stroke="#e2e8f0"/><text x="64" y="66.5" text-anchor="end" font-size="12" fill="#475569">100</text>
<line x1="350.0" y1="40" x2="350.0" y2="310" stroke="#94a3b8" stroke-width="1.5"/>
<line x1="70" y1="175.0" x2="630" y2="175.0" stroke="#94a3b8" stroke-width="1.5"/>
<polyline fill="none" stroke="#ea580c" stroke-width="3" stroke-linejoin="round" points="70.0,242.5 310.0,242.5 310.0,175.0 390.0,175.0 390.0,107.5 630.0,107.5"/>
<polyline fill="none" stroke="#2563eb" stroke-width="3" stroke-linejoin="round" points="70.0,287.5 630.0,62.5"/>
<text x="350" y="350" text-anchor="middle" font-size="13">line position (&#8722;3500 = far left, +3500 = far right)</text>
<text x="24" y="175" font-size="13" transform="rotate(-90 24 175)" text-anchor="middle">steering correction</text>
<text x="70" y="28" font-size="14" font-weight="700">Correction applied to the wheels: drive(base + c, base &#8722; c)</text>
<line x1="90" y1="62" x2="116" y2="62" stroke="#ea580c" stroke-width="3"/><text x="124" y="66" font-size="13">Bang-bang: fixed &#177;60, nothing in the middle band (jerky)</text>
<line x1="90" y1="86" x2="116" y2="86" stroke="#2563eb" stroke-width="3"/><text x="124" y="90" font-size="13">Proportional: c = Kp &#215; position, Kp = 0.03 (smooth)</text>
</g>
</svg>
