<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 320" role="img" aria-label="I2C bus: one ESP32 master and three devices sharing the SDA and SCL wires, each with its own address, with pull-up resistors to 3.3 volts">
  <rect width="680" height="320" rx="12" fill="#f8fafc"/>
  <g font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1e293b">
    <!-- 3.3V rail and pull-up resistors -->
    <line x1="210" y1="36" x2="240" y2="36" stroke="#dc2626" stroke-width="3"/>
    <text x="196" y="41" text-anchor="end" fill="#dc2626" font-weight="700">3.3 V</text>
    <line x1="210" y1="36" x2="210" y2="60" stroke="#dc2626" stroke-width="2"/>
    <rect x="203" y="60" width="14" height="36" fill="#fff" stroke="#334155" stroke-width="2"/>
    <line x1="210" y1="96" x2="210" y2="120" stroke="#334155" stroke-width="2"/>
    <line x1="240" y1="36" x2="240" y2="60" stroke="#dc2626" stroke-width="2"/>
    <rect x="233" y="60" width="14" height="36" fill="#fff" stroke="#334155" stroke-width="2"/>
    <line x1="240" y1="96" x2="240" y2="160" stroke="#334155" stroke-width="2"/>
    <text x="198" y="82" text-anchor="end" font-size="12" fill="#475569">4.7 kΩ</text>
    <text x="254" y="82" font-size="12" fill="#475569">4.7 kΩ</text>

    <!-- master -->
    <rect x="30" y="90" width="130" height="100" rx="10" fill="#e0ecff" stroke="#2563eb" stroke-width="2"/>
    <text x="95" y="132" text-anchor="middle" font-weight="700" font-size="16">ESP32</text>
    <text x="95" y="152" text-anchor="middle" font-size="13" fill="#475569">(master)</text>
    <text x="152" y="115" text-anchor="end" font-size="11" fill="#475569">GPIO21</text>
    <text x="152" y="177" text-anchor="end" font-size="11" fill="#475569">GPIO22</text>

    <!-- bus lines -->
    <line x1="160" y1="120" x2="600" y2="120" stroke="#2563eb" stroke-width="3"/>
    <line x1="160" y1="160" x2="600" y2="160" stroke="#16a34a" stroke-width="3"/>
    <text x="610" y="125" fill="#2563eb" font-weight="700">SDA</text>
    <text x="610" y="165" fill="#16a34a" font-weight="700">SCL</text>
    <circle cx="210" cy="120" r="4" fill="#2563eb"/>
    <circle cx="240" cy="160" r="4" fill="#16a34a"/>

    <!-- devices -->
    <g>
      <rect x="270" y="210" width="100" height="64" rx="8" fill="#fff" stroke="#334155" stroke-width="2"/>
      <text x="320" y="236" text-anchor="middle" font-weight="700">IMU</text>
      <text x="320" y="258" text-anchor="middle" fill="#475569">0x68</text>
      <line x1="300" y1="120" x2="300" y2="210" stroke="#2563eb" stroke-width="2"/>
      <line x1="340" y1="160" x2="340" y2="210" stroke="#16a34a" stroke-width="2"/>
      <circle cx="300" cy="120" r="4" fill="#2563eb"/><circle cx="340" cy="160" r="4" fill="#16a34a"/>
    </g>
    <g>
      <rect x="390" y="210" width="100" height="64" rx="8" fill="#fff" stroke="#334155" stroke-width="2"/>
      <text x="440" y="236" text-anchor="middle" font-weight="700">OLED</text>
      <text x="440" y="258" text-anchor="middle" fill="#475569">0x3C</text>
      <line x1="420" y1="120" x2="420" y2="210" stroke="#2563eb" stroke-width="2"/>
      <line x1="460" y1="160" x2="460" y2="210" stroke="#16a34a" stroke-width="2"/>
      <circle cx="420" cy="120" r="4" fill="#2563eb"/><circle cx="460" cy="160" r="4" fill="#16a34a"/>
    </g>
    <g>
      <rect x="510" y="210" width="100" height="64" rx="8" fill="#fff" stroke="#334155" stroke-width="2"/>
      <text x="560" y="236" text-anchor="middle" font-weight="700">ADC</text>
      <text x="560" y="258" text-anchor="middle" fill="#475569">0x48</text>
      <line x1="540" y1="120" x2="540" y2="210" stroke="#2563eb" stroke-width="2"/>
      <line x1="580" y1="160" x2="580" y2="210" stroke="#16a34a" stroke-width="2"/>
      <circle cx="540" cy="120" r="4" fill="#2563eb"/><circle cx="580" cy="160" r="4" fill="#16a34a"/>
    </g>

    <text x="340" y="304" text-anchor="middle" font-size="14" fill="#475569">All devices share the same two wires; each one answers only to its own address.</text>
  </g>
</svg>
