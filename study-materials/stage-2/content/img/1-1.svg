<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 270" role="img" aria-label="UART wiring: TX of each side goes to RX of the other, and the grounds are joined">
  <defs>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2563eb"/></marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#16a34a"/></marker>
  </defs>
  <rect width="640" height="270" rx="12" fill="#f8fafc"/>
  <g font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#1e293b">
    <rect x="40" y="40" width="170" height="170" rx="10" fill="#e0ecff" stroke="#2563eb" stroke-width="2"/>
    <text x="125" y="68" text-anchor="middle" font-weight="700" font-size="17">ESP32 (A)</text>
    <text x="198" y="110" text-anchor="end">TX</text>
    <text x="198" y="150" text-anchor="end">RX</text>
    <text x="198" y="190" text-anchor="end">GND</text>

    <rect x="430" y="40" width="170" height="170" rx="10" fill="#e0ecff" stroke="#2563eb" stroke-width="2"/>
    <text x="515" y="68" text-anchor="middle" font-weight="700" font-size="17">Other device (B)</text>
    <text x="442" y="110">TX</text>
    <text x="442" y="150">RX</text>
    <text x="442" y="190">GND</text>

    <line x1="210" y1="105" x2="428" y2="145" stroke="#2563eb" stroke-width="3" marker-end="url(#ab)"/>
    <line x1="430" y1="105" x2="212" y2="145" stroke="#16a34a" stroke-width="3" marker-end="url(#ag)"/>
    <line x1="210" y1="185" x2="430" y2="185" stroke="#334155" stroke-width="3"/>

    <text x="320" y="240" text-anchor="middle" font-size="14" fill="#475569">Cross the data wires: TX goes to RX, RX goes to TX. GND is shared.</text>
    <text x="320" y="258" text-anchor="middle" font-size="14" fill="#475569">Both sides must use the same baud rate.</text>
  </g>
</svg>
